id: net.mkiol.SpeechNote.Addon.amd
runtime: net.mkiol.SpeechNote
runtime-version: beta
sdk: org.kde.Sdk//6.11
build-extension: true
build-options:
  no-debuginfo: true
  prefix: /app/extensions/amd
cleanup:
  - /lib/cmake
  - /lib/pkgconfig
  - /include
  - "*.a"
modules:
  - name: rocm
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - |
        set -e
        mkdir -p ${FLATPAK_DEST}
        cd ${FLATPAK_DEST}
        ln -s ${FLATPAK_DEST}/extra/rocm rocm
    sources:
      - rocm-deb-sources-7.2.4.yaml

  - name: python3-pybind11
    only-arches:
      - x86_64
    buildsystem: simple
    cleanup:
      - /bin
      - /lib/python3.13/site-packages/pybind11*
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "pybind11" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b3/06/c3a23c9a0263b136c519f033a58d4641e73065fefc7754e9667ec206d992/pybind11-3.0.4-py3-none-any.whl
        sha256: 961720ee652da51d531b7b2451a6bd2bc042b0106e6d9baa48ecb7d58034ce63

  # Due to the limitations of the Flathub infrastructure, it is not possible to build ROCm version of ctranslate2 and whisper.cpp.
  # To overcome this problem, pre-compiled binaries from https://github.com/mkiol/dsnote are installed.
  - name: precompiled-binaries
    only-arches:
      - x86_64
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/extensions/amd/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
    cleanup:
      - /bin
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --prefix=${FLATPAK_DEST} --no-build-isolation *.whl
      - install -Dm644 *.so* ${FLATPAK_DEST}/lib/
      - |
        set -e
        cd ${FLATPAK_DEST}/lib
        ln -s libctranslate2.so.4.8.1 libctranslate2.so.4
        ln -s libctranslate2.so.4.8.1 libctranslate2.so
    sources:
      - type: archive
        strip-components: 0
        url: https://github.com/mkiol/dsnote/releases/download/b4.9.1-1/flatpak_binaries_amd_1_5.tar.xz
        sha256: 5b7fd8e31d0f0a41159ceb18c84b26ff705a5f4b3a7738e3eb36115a8d1b6b7f

  - name: python3-torch-rocm
    only-arches:
      - x86_64
    buildsystem: simple
    build-options:
      env:
        PYTHONPATH: /app/extensions/amd/lib/python3.13/site-packages:/app/lib/python3.13/site-packages
    build-commands:
      - |
        set -e
        libs=(torch torch-2.12.0+rocm7.2.dist-info functorch torchgen
              torchaudio torchaudio-2.11.0+rocm7.2.dist-info
              triton triton_rocm-3.6.0.dist-info torio)
        src_dir="${FLATPAK_DEST}/extra/site-packages"
        trg_dir="${FLATPAK_DEST}/lib/python3.13/site-packages"
        mkdir -p "${trg_dir}"
        cd "${trg_dir}"
        for lib in "${libs[@]}"; do
          ln -s "${src_dir}/${lib}" ${lib}
        done
    sources:
      - type: extra-data
        url: https://download-r2.pytorch.org/whl/rocm7.2/torch-2.12.0%2Brocm7.2-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 58c07e4cc60c1c47d96bbffb9222f47c1090fc5dea8d9418146d2508a87b785e
        filename: torch.whl
        size: 6177018819
      - type: extra-data
        url: https://download-r2.pytorch.org/whl/rocm7.2/torchaudio-2.11.0%2Brocm7.2-cp313-cp313-manylinux_2_28_x86_64.whl
        sha256: 9228e1c534d04d80fa7b46205f448da947fd06f5573ba8602f041b504edb3596
        filename: torchaudio.whl
        size: 337774
      - type: extra-data
        url: https://download-r2.pytorch.org/whl/triton_rocm-3.6.0-cp313-cp313-linux_x86_64.whl
        sha256: d43b44f045d7f78d1dfe03b2debce36e0d756041a853633a2677ce5a890a269e
        filename: triton_rocm.whl
        size: 302485249

  - name: apply-extra-script
    only-arches:
      - x86_64
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm755 /usr/bin/ar ${FLATPAK_DEST}/bin/ar
      - install -Dm644 /usr/lib/x86_64-linux-gnu/libsframe.so.3 ${FLATPAK_DEST}/lib/libsframe.so.3
      - install -Dm644 /usr/lib/x86_64-linux-gnu/libbfd-2.46.so ${FLATPAK_DEST}/lib/libbfd-2.46.so
    sources:
      - type: script
        dest-filename: apply_extra
        commands:
          - |
            echo
            echo "Files to install:"
            ls
          - |
            set -e
            extra_dir="/app/extra"
            trg_dir="${extra_dir}/rocm"
            tmp_dir="${extra_dir}/rocm_tmp"

            echo "Installing ROCm..."
            mkdir -p "${tmp_dir}"
            for f in *.deb; do
              mv "$f" "${tmp_dir}/"
            done
            cd "${tmp_dir}"
            for f in *.deb; do
              echo "Installing ${f}..."
              tmp="${f}_tmp"
              mkdir -p "$tmp"
              mv "$f" $tmp/
              cd "$tmp"/
              ar x "$f"
              rm -f "$f"
              tar -xf data.tar.* -C ../ --no-same-owner --no-same-permissions
              cd ..
              rm -rf "$tmp"
            done
            mv -T opt/rocm-* "${trg_dir}"
            cd "${extra_dir}"
            rm -r "${tmp_dir}"

            # cleanup
            paths=(.info bin share/amd* share/doc share/dec share/hip share/hipfort share/html
                   share/info share/man share/mivisionx share/modulefiles share/openmp-extras
                   share/pkgconfig share/rccl share/rdhc share/rocdecode share/rocgdb share/rocjpg
                   share/rocm* share/rocprofiler* share/rocmcmakebuildtools share/modulefiles 
                   lib/libOpenCL.so* lib/cmake lib/rocmmod lib/CMakeFiles lib/llvm/lib-debug 
                   lib/llvm/share lib/python* libexec llvm include)
            for path in "${paths[@]}"; do
              rm -rf "${trg_dir}/"${path}
            done
            for f in $(find "$trg_dir" -name "*.a"); do
              rm -f "$f"
            done

            # create missing links
            cd "${trg_dir}/lib"
            for lib in *.so.[0-9]*; do
              if [[ -f "$lib" ]]; then
                  target="${lib%.*}"
                  if [[ ! -e "$target" ]]; then
                      ln -s "$lib" "$target"
                  fi
              fi
            done
          - |
            set -e
            extra_dir="/app/extra"
            trg_dir="${extra_dir}/site-packages"
            echo "Installing PyTorch..."
            libs=(torch torchaudio triton_rocm)
            mkdir -p "${trg_dir}"
            cd "${trg_dir}"
            for lib in "${libs[@]}"; do
              echo "Installing ${lib}.whl..."
              unzip -q ../${lib}.whl
              rm -rf ../${lib}.whl
            done

            # cleanup
            paths=(torch/lib/rocblas torch/lib/libamd* torch/lib/libroc* torch/lib/libhip*
                   torch/lib/libhsa* torch/lib/libMIOpen* torch/lib/librccl* torch/lib/libnuma*
                   torch/lib/hipblas* torch/lib/msccl-algorithms torch/include)
            for path in "${paths[@]}"; do
              rm -rf ${path}
            done
            for f in $(find . -name "*.a"); do
              rm -f "$f"
            done

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: net.mkiol.SpeechNote.Addon.amd.metainfo.xml
